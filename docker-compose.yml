services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      OPEN_SWAGGER: "false"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
      DATABASE_URL: ${DATABASE_URL_DOCKER:-mysql://root@host.docker.internal:3306/stockflow}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env antes de iniciar os containers}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:3000
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped
